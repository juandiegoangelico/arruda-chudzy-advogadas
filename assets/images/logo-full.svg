<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70" role="img" aria-label="Arruda Chudzy Advogadas">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#742356"/>
      <stop offset="100%" stop-color="#65194B"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F2F5"/>
    </linearGradient>
  </defs>
  <!-- Monogram Box -->
  <rect x="0" y="5" width="60" height="60" rx="14" fill="url(#logoGrad)"/>
  <rect x="2" y="7" width="56" height="56" rx="12" fill="none" stroke="#C9A0B8" stroke-width="1" stroke-opacity="0.4"/>
  <g transform="translate(10, 10)" fill="url(#roseGrad)">
    <text x="10" y="37" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="34" font-weight="400" letter-spacing="-2" text-anchor="middle">A</text>
    <text x="28" y="39" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="34" font-weight="300" letter-spacing="-1" text-anchor="middle" opacity="0.92">C</text>
  </g>
  <!-- Firm Text -->
  <text x="76" y="34" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="20" font-weight="600" letter-spacing="2.8" fill="#F8F2F5">ARRUDA CHUDZY</text>
  <text x="77" y="53" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="9.5" font-weight="500" letter-spacing="4.5" fill="#C9A0B8">ADVOGADAS ASSOCIADAS</text>
</svg>
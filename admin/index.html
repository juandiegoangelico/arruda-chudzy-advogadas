<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>Painel de Artigos | Arruda Chudzy Advogadas</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link href="config.yml" type="application/yaml" rel="cms-config-url" />

  <style>
    :root {
      --s-primary-color: #65194B;
      --s-accent-color: #C9A0B8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF6F8;
    }
  </style>

  <script>
    // Helper seguro de ativação rápida: prioriza fragmento hash (#token=) para que o segredo não trafegue em cabeçalhos HTTP
    (function() {
      try {
        const hash = window.location.hash;
        const params = new URLSearchParams(window.location.search);
        let token = null;

        // 1. Extração segura via fragmento Hash (não é enviado ao servidor / CDN)
        if (hash && hash.includes('token=')) {
          const match = hash.match(/token=([a-zA-Z0-9_\-]+)/);
          if (match) token = match[1];
        }

        // 2. Fallback de contingência caso venha por query param
        if (!token && params.has('token')) {
          token = params.get('token');
        }

        if (token) {
          localStorage.setItem('sveltia-cms.user', JSON.stringify({
            backendName: 'github',
            token: token
          }));
          // Higieniza imediatamente a barra de endereços (remove query string e hash do histórico)
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } catch (e) {
        console.error('Erro ao configurar autenticação:', e);
      }
    })();
  </script>

  <!-- Sveltia CMS Oficial com versão major protegida -->
  <script src="https://unpkg.com/@sveltia/cms@^0/dist/sveltia-cms.js"></script>
</head>
<body>
</body>
</html>
